<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Tareas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="card">
    <h1>Gestor de Tareas</h1>
    <p class="subtitle">Proyecto CRUD — Programación III</p>

    <form id="task-form" class="task-form">
      <input type="text" id="task-title" placeholder="Escribe una nueva tarea..." required />
      <button type="submit">Agregar</button>
    </form>
    <p class="error-message" id="error-message" hidden></p>

    <p class="counter" id="counter">0 tareas</p>

    <ul id="task-list" class="task-list"></ul>

    <p class="empty-state" id="empty-state" hidden>No tienes tareas todavía.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
